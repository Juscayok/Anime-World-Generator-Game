<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime World Generator v1.0</title><meta name="application-version" content="1.0"><meta name="description" content="Spin your anime destiny. Build a character, unlock powers, and face your final enemy."><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="fit.css"></head>
<body><header><a class="brand" href="index.html"><span class="brand-icon">◉</span> ANIME WORLD GENERATOR</a><nav id="animeTabs" aria-label="Anime worlds"></nav><div class="header-actions"><button id="library">▣ <span>My Characters</span></button><button id="sound" aria-label="Toggle sound" title="Toggle sound">♫</button><button id="settings" aria-label="Settings">⚙</button></div></header>
<main><aside class="panel journey"><div class="eyebrow">⛩ &nbsp; YOUR RUN</div><h2 id="progressText"></h2><div class="progress-track"><div id="progressBar"></div></div><div id="chapters"></div><div class="journey-bottom"><strong id="rerollsLeft"></strong><p>One spin can change everything.</p><button id="newRun" class="subtle">New run</button><div class="landscape">ANOTHER WORLD.<br>ANOTHER YOU.</div></div></aside>
<section class="panel play"><div class="eyebrow" id="stepLabel"></div><h1 id="question"></h1><p id="context" class="muted"></p><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="1100" height="1100" aria-label="Weighted prize wheel"></canvas><div class="wheel-hub">◉<small>YOUR DESTINY</small></div></div><div class="reveal" aria-live="polite"><h2 id="result">YOUR STORY STARTS HERE</h2><span id="resultTag" class="tag">SPIN TO BEGIN</span></div><div class="controls"><button id="spin" class="primary">SPIN THE WHEEL</button><button id="reroll">↻ &nbsp; Reroll</button></div><button id="viewOdds" class="odds-button">View wheel odds</button><p id="battleHint" class="muted"></p></section>
<aside class="right"><section class="panel build"><div class="build-heading"><div class="eyebrow">▥ &nbsp; YOUR BUILD</div><button id="characterSheet" class="subtle">Full sheet</button></div><div class="identity"><div class="avatar">✦</div><div><h2 id="identity">Unknown protagonist</h2><p id="worldName"></p></div></div><div id="buildRows"></div></section><section class="panel verdict"><div class="verdict-heading"><div class="eyebrow">▣ &nbsp; THE VERDICT</div><span id="reactionTag" class="tag">NEW STORY</span></div><div class="reaction-stage"><div id="reactionImage" class="reaction-image" role="img" aria-label="Anime character reaction"></div></div><div class="reaction-copy"><span id="reactionSpeaker"></span><p id="reactionText">Your origin story is one spin away.</p></div></section></aside></main>
<div class="mobile-tabs" aria-label="Game panels"><button id="showWheel" aria-pressed="true">Wheel</button><button id="showBuild" aria-pressed="false">Character</button><button id="showReactions" aria-pressed="false">Reactions</button></div>
<footer><span class="version-badge" aria-label="Version 1.0">v1.0</span><div id="statStrip"></div><span id="saveStatus">Saved on this device</span></footer>
<dialog id="dialog"><div class="dialog-top"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="Close dialog">✕</button></div><div id="dialogBody"></div></dialog><script src="game.js"></script><script src="app.js"></script></body></html>

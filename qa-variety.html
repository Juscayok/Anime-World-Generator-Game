<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character variety visual checks</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="fit.css"><style>html{overflow:auto!important;height:auto!important}body{padding:20px;overflow:auto!important;height:auto!important}h1{font:700 26px 'Segoe UI'}#scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.battle-scene{height:330px;min-height:0}.qa-label{font-size:13px;color:#b9c9e9;margin:8px}.gallery{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-top:20px}.gallery figure{margin:0}.qa-face{aspect-ratio:3/4;background-image:url('reaction-cast-v2.png');background-size:600% 300%}.gallery figcaption{font-size:12px;margin:6px 0}@media(max-width:600px){#scenes{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(3,1fr)}}</style>
<h1>Cohesive full-body characters and battle poses</h1><label>Anime <select id="qaWorld"></select></label> <label>Appearance <select id="qaVariant"><option value="0">Variant 1</option><option value="1">Variant 2</option></select></label><p class="qa-label">Each character is one complete illustration. Compare the same identity across three victory and three defeat poses.</p><div id="scenes"></div><div class="gallery" id="cast"></div>
<script src="reaction-variety.js"></script><script src="dialogue-expansion.js?v=dialogue-1"></script><script src="worlds-extra.js"></script><script src="reactions-extra.js"></script><script src="character-art.js?v=cohesive-1"></script><script src="portrait.js"></script><script src="reactions.js"></script><script src="game.js"></script><script src="battle-art.js"></script><script src="battle.js"></script>
<script>
const worldSelect=document.getElementById('qaWorld'),variantSelect=document.getElementById('qaVariant');
for(const [id,world] of Object.entries(AWG.worlds)){const option=document.createElement('option');option.value=id;option.textContent=world.name;worldSelect.append(option)}worldSelect.value='onepiece';
function paint(){document.getElementById('scenes').replaceChildren();const world=worldSelect.value,variant=Number(variantSelect.value);
for(const gender of ['male','female'])for(let pose=0;pose<3;pose++)for(const outcome of ['VICTORY','DEFEAT']){
 const run=AWG.fresh(world,gender);for(let n=0;n<100;n++){run.id='qa-'+n;const seed=AWGPortrait.describe(run).seed;if(seed%3===pose&&Math.floor(seed/3)%2===variant)break;}
 run.finished=true;run.results=[{id:'origin',label:'Human'},{id:'faction',label:AWG.worlds[world].groups[0]},{id:'exactAge',label:'25'},{id:'enemy',label:AWG.worlds[world].enemies[0]},{id:'win',label:outcome},{id:'field',label:'City ruins'}];
 const card=document.createElement('div'),label=document.createElement('p'),scene=document.createElement('div');label.className='qa-label';label.textContent=gender+' · '+outcome.toLowerCase()+' · pose '+(pose+1);AWGBattle.render(scene,run);card.append(label,scene);document.getElementById('scenes').append(card);
}}worldSelect.onchange=paint;variantSelect.onchange=paint;paint();
AWGReactionVariety.portraits.forEach((name,i)=>{const f=document.createElement('figure'),face=document.createElement('div'),c=document.createElement('figcaption');face.className='qa-face';face.style.backgroundPosition=(i%6*20)+'% '+(Math.floor(i/6)*50)+'%';c.textContent=name;f.append(face,c);document.getElementById('cast').append(f)});
</script></html>

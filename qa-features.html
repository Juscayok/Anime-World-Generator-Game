<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identity transformations and battle scenery</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="fit.css"><style>
html,body{height:auto;overflow:auto}body{display:block;padding:24px;background:#0b1020}h1{font:700 26px 'Segoe UI'}p{color:#becbe2}.qa-controls{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}label{display:flex;align-items:center;gap:10px}select{padding:8px;background:#1c2740;color:white;border:1px solid #62708d;border-radius:6px}.qa-scenes{display:grid;grid-template-columns:1fr 1fr;gap:20px}.qa-card{min-width:0}.qa-card h2{font:600 16px 'Segoe UI';color:#c7b2ff}.qa-scenes .battle-scene{height:380px}.qa-portrait{height:300px;max-width:250px;margin:24px auto}.qa-description{text-align:center}@media(max-width:700px){body{padding:12px}.qa-scenes{grid-template-columns:1fr}.qa-scenes .battle-scene{height:330px}}
</style><h1>Identity transformations & battle scenery</h1><p>The same character appears in the portrait, victory, and defeat scenes.</p><div class="qa-controls"><label>Identity <select id="qaIdentity"></select></label><label>Appearance <select id="qaGender"><option value="male">Male</option><option value="female">Female</option></select></label><label>Battlefield <select id="qaField"><option>City ruins</option><option>Open plains</option><option>Dense forest</option><option>Underground arena</option><option>Mountain summit</option></select></label></div><div class="qa-scenes"><section class="qa-card"><h2>Victory</h2><div id="qaVictory"></div></section><section class="qa-card"><h2>Defeat</h2><div id="qaDefeat"></div></section></div><div id="qaPortrait" class="qa-portrait"></div><p id="qaDescription" class="qa-description"></p>
<script src="reaction-variety.js"></script><script src="dialogue-expansion.js"></script><script src="worlds-extra.js"></script><script src="reactions-extra.js"></script><script src="character-art.js"></script><script src="identity-art.js"></script><script src="portrait.js"></script><script src="reactions.js"></script><script src="game.js"></script><script src="battle-art.js"></script><script src="battle.js"></script><script>
const cases=[['Majin','dragonball'],['Exceed','fairytail'],['Namekian','dragonball'],['Frost demon','dragonball'],['Saiyan','dragonball'],['Android','dragonball'],['Fish-man','onepiece'],['Mink','onepiece'],['Giant','onepiece'],['Lunarian','onepiece'],['Cursed spirit','jjk'],['Arrancar','bleach'],['Visored','bleach'],['Chimera Ant','hxh'],...Object.keys(AWGIdentityArt).filter(x=>x.includes('Titan')).map(x=>[x,'aot'])];
for(const [i,[name]] of cases.entries()){const o=document.createElement('option');o.value=i;o.textContent=name;qaIdentity.append(o)}
function paint(){const [origin,world]=cases[Number(qaIdentity.value)],run=AWG.fresh(world,qaGender.value);run.id='identity-preview';run.finished=true;run.results=[{id:'origin',label:world==='aot'?'Scout recruit':origin},{id:'exactAge',label:'25'},{id:'faction',label:AWG.worlds[world].groups[0]},{id:'enemy',label:AWG.worlds[world].enemies[4]},{id:'enemyLevel',label:'Full power'},{id:'field',label:qaField.value}];if(world==='aot')run.results.push({id:'extra1',name:'Titan form',label:origin});for(const [id,result] of [['qaVictory','VICTORY'],['qaDefeat','DEFEAT']]){const sample=JSON.parse(JSON.stringify(run));sample.results.push({id:'win',label:result});AWGBattle.render(document.getElementById(id),sample)}AWGPortrait.render(qaPortrait,run,false);qaPortrait.classList.add('qa-portrait');qaDescription.textContent=origin+' · '+AWG.worlds[world].name+' · '+qaGender.value;}
qaIdentity.onchange=qaGender.onchange=qaField.onchange=paint;paint();
</script></html>
